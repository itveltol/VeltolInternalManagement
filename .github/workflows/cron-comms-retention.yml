name: Cron - comms retention

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron endpoint
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET "${{ vars.APP_BASE_URL }}/api/cron/comms-retention" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat /tmp/response.json
          if [ "$response" -ge 300 ]; then
            echo "Request failed with status $response"
            exit 1
          fi
